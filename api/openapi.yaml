openapi: 3.1.0
info:
  title: AI Workspace V2.0 Core API
  version: 1.3.0
  description: |
    Frozen REST contract between the native browser client and the C++ core.
    All API requests are same-origin and authenticated by an HttpOnly session cookie.
    Mutating requests must include `X-Request-ID`; EventSource passes `request_id` as a query parameter.
    Project-first routes are frozen and implemented by the C++ core; the native browser client also uses these routes.
    Non-members receive 403. Project archive is a soft close: the explicit archive operation is owner-only, and archived Projects remain readable while all writes return 409. No unarchive operation is defined.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Auth
  - name: Projects
  - name: Agents
  - name: Conversations
  - name: Runs
  - name: Health
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Start a same-origin session
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: { type: string, minLength: 1, maxLength: 80 }
                password: { type: string, minLength: 8, maxLength: 200 }
            example:
              username: demo
              password: demo1234
      responses:
        '200':
          description: Authenticated
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly SameSite=Lax session cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current session
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204': { description: Session revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Get the current user
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/projects:
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a Project and make the caller its owner
      description: Any authenticated user may create a Project. The caller is inserted as the initial owner member.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List Projects visible through membership
      description: Returns only Projects where the current user is a member.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Member Projects
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Read a Project as a member
      description: All Project members may read the Project. Non-members receive 403 without resource details.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects/{project_id}/archive:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Projects]
      operationId: archiveProject
      summary: Soft-close a Project
      description: Owner only. Archiving preserves Project, membership, Agent, Conversation, Message, Run and audit history. It returns 409 while any Run is queued or running. Repeating archive on an already archived Project returns the current Project. There is no unarchive operation in this contract.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Project archived or already archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects/{project_id}/audit-events:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: listProjectAuditEvents
      summary: Read redacted Project audit events
      description: Owner only. Returns Project-scoped audit events with whitelisted metadata only; message bodies, cookies, Authorization headers and API keys are never returned.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Redacted Project audit events
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects/{project_id}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Projects]
      operationId: addProjectMember
      summary: Add an existing user to a Project
      description: Owner only. A user has at most one role in a Project.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddProjectMemberRequest' }
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMember' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Projects]
      operationId: listProjectMembers
      summary: List Project members
      description: Any Project member may read the member list.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Project members
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProjectMember' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects/{project_id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Projects]
      operationId: updateProjectMember
      summary: Change a Project member role
      description: Owner only. Downgrading the last owner returns 409.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProjectMemberRequest' }
      responses:
        '200':
          description: Member role updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectMember' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [Projects]
      operationId: removeProjectMember
      summary: Remove a Project member
      description: Owner only. Removing the last owner or a member with an active Run returns 409.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204': { description: Member removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects/{project_id}/agents:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Projects]
      operationId: addProjectAgent
      summary: Add the caller's own Agent to a Project
      description: Owner/editor only. The Agent owner must equal the caller and already be a Project member.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddProjectAgentRequest' }
      responses:
        '201':
          description: Agent added to Project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectAgent' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Projects]
      operationId: listProjectAgents
      summary: List Agents available in a Project
      description: Any Project member may read the Project Agent list.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Project Agents
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ProjectAgent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects/{project_id}/agents/{agent_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/ProjectAgentId'
    delete:
      tags: [Projects]
      operationId: removeProjectAgent
      summary: Remove an Agent from a Project
      description: The Agent owner or Project owner may remove it. An active Run using the Agent returns 409.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204': { description: Agent removed from Project; history is retained }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/projects/{project_id}/conversations:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Conversations]
      operationId: createProjectConversation
      summary: Create a shared Project Conversation
      description: Owner/editor only. All Project members can later read the Conversation and its messages.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectConversationRequest' }
      responses:
        '201':
          description: Project Conversation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [Conversations]
      operationId: listProjectConversations
      summary: List all Conversations in a Project
      description: Any Project member may read every Conversation in the Project.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Project Conversations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/agents:
    get:
      tags: [Agents]
      operationId: listAgents
      summary: List only the current user's agents
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Owned agents
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Agents]
      operationId: createAgent
      summary: Create an agent owned by the current user
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAgentRequest' }
      responses:
        '201':
          description: Agent created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/conversations:
    get:
      tags: [Conversations]
      operationId: listConversations
      summary: List Conversations visible through Project membership (legacy URL)
      description: Project members can read every Conversation in the Project. The legacy URL is retained.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Owned conversations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Conversations]
      operationId: createConversation
      summary: Create a compatibility Conversation using an owned agent
      description: Legacy single-user URL. New Project-first clients should use POST /api/v1/projects/{project_id}/conversations.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [agent_id]
              properties:
                agent_id: { type: string, format: uuid }
                title: { type: string, maxLength: 200 }
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/conversations/{conversation_id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Conversations]
      operationId: listMessages
      summary: Read stable, ordered history as a Project member
      description: Any Project member may read all messages in a shared Conversation.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: after_seq
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Message history
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Conversations]
      operationId: sendMessage
      summary: Send a Project message to the selected target Agent
      description: Owner/editor only. target_agent_id must identify an active Agent in the Conversation's Project. An existing queued/running Run returns 409.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 8, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content, client_request_id, target_agent_id]
              properties:
                content: { type: string, minLength: 1, maxLength: 32000 }
                client_request_id:
                  type: string
                  minLength: 8
                  maxLength: 100
                  description: Required sender-scoped idempotency key. Reuse only when retrying the same logical send.
                target_agent_id:
                  type: string
                  format: uuid
                  description: Required active Project Agent selected for this Run.
      responses:
        '202':
          description: Run queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendMessageResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/conversations/{conversation_id}/events:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [Conversations]
      operationId: streamConversationEvents
      summary: Subscribe to new Run availability with conversation cursor replay
      description: Any Project member may stream. Viewer access is read-only; non-members receive 403. Omit cursor to start at the current tail; send Last-Event-ID or after to replay.
      parameters:
        - name: request_id
          in: query
          required: true
          schema: { type: string, minLength: 8, maxLength: 100 }
        - name: Last-Event-ID
          in: header
          schema: { type: string }
        - name: after
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Conversation SSE stream; event schema is documented in docs/contracts/sse-events.md
          headers:
            Cache-Control:
              schema: { type: string, const: no-cache }
            X-Accel-Buffering:
              schema: { type: string, const: 'no' }
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                retry: 2000
                id: 1
                event: run.available
                data: {"schema_version":"1.0","conversation_id":"...","seq":1,"type":"run.available","payload":{"run_id":"...","target_agent_id":"...","initiated_by_user_id":"...","status":"queued"}}
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: getRun
      summary: Read a Run with derived Agent Owner attribution
      description: Any Project member may read the Run. The response includes both the actual target Agent and its derived Agent Owner.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Current run state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/runs/{run_id}/events:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [Runs]
      operationId: streamRunEvents
      summary: Subscribe as a Project member with Last-Event-ID replay
      description: Any Project member may stream the Run. Viewer access is read-only; non-members receive 403.
      parameters:
        - name: request_id
          in: query
          required: true
          schema: { type: string, minLength: 8, maxLength: 100 }
        - name: Last-Event-ID
          in: header
          schema: { type: string }
        - name: after
          in: query
          schema: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: SSE stream; event schema is documented in docs/contracts/sse-events.md
          headers:
            Cache-Control:
              schema: { type: string, const: no-cache }
            X-Accel-Buffering:
              schema: { type: string, const: 'no' }
          content:
            text/event-stream:
              schema: { type: string }
              example: |
                retry: 2000
                id: 1
                event: run.started
                data: {"schema_version":"1.0","run_id":"...","seq":1,"type":"run.started","payload":{}}

        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/runs/{run_id}/cancel:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: cancelRun
      summary: Cancel a Run under Project member permissions
      description: Owner/editor may cancel their own Run; Project owner may cancel any Run; viewer cannot cancel.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Current run state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Run' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/runs/{run_id}/retry:
    parameters:
      - $ref: '#/components/parameters/RunId'
    post:
      tags: [Runs]
      operationId: retryRun
      summary: Retry a Run under Project member permissions
      description: Owner/editor may retry their own terminal Run; Project owner may retry another member's Run; viewer cannot retry.
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - name: Idempotency-Key
          in: header
          required: false
          description: Repeating the same key for the same user returns the first retry run.
          schema: { type: string, minLength: 8, maxLength: 100 }
      responses:
        '202':
          description: Retry queued or the original retry run returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendMessageResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/health:
    get:
      tags: [Health]
      operationId: health
      summary: Dependency health without secrets
      responses:
        '200':
          description: Core and database are healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  database: { type: string, enum: [ok, unavailable] }
                  version: { type: string, const: 1.0.0 }
        '503':
          description: Database dependency is unavailable
          content:
            application/json:
              schema:
                type: object
                required: [status, database]
                properties:
                  status: { type: string, const: degraded }
                  database: { type: string, const: unavailable }
                  version: { type: string, const: 1.0.0 }
components:
  parameters:
    RequestId:
      name: X-Request-ID
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 100 }
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    ProjectRole:
      type: string
      description: Frozen MVP role set. Admin and guest are out of scope.
      enum: [owner, editor, viewer]
    Project:
      type: object
      description: Project members can read all Conversations in the Project. Owners may soft-close the Project through the explicit archive operation; archived Projects remain readable and reject writes.
      required: [id, name, status, created_by_user_id, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'] }
        status: { type: string, enum: [active, archived] }
        created_by_user_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProjectMember:
      type: object
      description: One role per user per Project. At least one owner is required.
      required: [project_id, user_id, role, created_at, updated_at]
      properties:
        project_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: '#/components/schemas/ProjectRole' }
        added_by_user_id: { type: [string, 'null'], format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AuditEvent:
      type: object
      description: Redacted audit record. Metadata is allowlisted and must never contain message content, cookies, Authorization headers or API keys.
      required: [id, actor_type, action, resource_type, result, request_id, metadata, created_at]
      properties:
        id: { type: string }
        actor_type: { type: string, enum: [user, worker, system] }
        actor_id: { type: [string, 'null'] }
        action: { type: string }
        resource_type: { type: string }
        resource_id: { type: [string, 'null'] }
        result: { type: string, enum: [allowed, denied, success, failure] }
        request_id: { type: string }
        metadata:
          type: object
          additionalProperties: true
          description: Allowlisted operational metadata only.
        created_at: { type: string, format: date-time }
    ProjectAgent:
      type: object
      description: Project Agent ownership remains on Agent.owner_id; this mapping grants Project use without transfer.
      required: [project_id, agent_id, added_by_user_id, created_at]
      properties:
        project_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        added_by_user_id: { type: string, format: uuid }
        agent: { $ref: '#/components/schemas/Agent' }
        created_at: { type: string, format: date-time }
    CreateProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 20000 }
    AddProjectMemberRequest:
      type: object
      additionalProperties: false
      required: [user_id, role]
      properties:
        user_id: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/ProjectRole' }
    UpdateProjectMemberRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/ProjectRole' }
    AddProjectAgentRequest:
      type: object
      additionalProperties: false
      required: [agent_id]
      properties:
        agent_id: { type: string, format: uuid }
    CreateProjectConversationRequest:
      type: object
      additionalProperties: false
      required: [agent_id]
      description: agent_id becomes the Conversation's historical default Agent; each new message still requires target_agent_id.
      properties:
        agent_id: { type: string, format: uuid }
        title: { type: string, maxLength: 200 }
    User:
      type: object
      required: [id, username, display_name]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        display_name: { type: string }
    LoginResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: '#/components/schemas/User' }
    ModelProvider:
      type: object
      required: [id, name, provider_type, model_name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        provider_type: { type: string, examples: [mock, openai_compatible] }
        model_name: { type: string }
    Agent:
      type: object
      required: [id, name, system_prompt, model_provider, status, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        avatar: { type: [string, 'null'] }
        system_prompt: { type: string }
        model_provider: { $ref: '#/components/schemas/ModelProvider' }
        status: { type: string, enum: [active, disabled] }
        created_at: { type: string, format: date-time }
    CreateAgentRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        avatar: { type: [string, 'null'], maxLength: 500000 }
        system_prompt: { type: string, maxLength: 8000, default: '' }
        model_provider_id: { type: string, format: uuid }
    Conversation:
      type: object
      description: Project membership grants access to every Conversation in the Project. owner_id is the creator field; agent_id is the historical default Agent.
      required: [id, project_id, owner_id, agent_id, title, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        agent_id:
          type: string
          format: uuid
          description: Historical default Agent. New message sends use target_agent_id.
        agent_name: { type: string }
        title: { type: string }
        status: { type: string, enum: [active, archived] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Message:
      type: object
      required: [id, conversation_id, seq, sender_type, role, content, status, created_at]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        seq: { type: integer, format: int64 }
        sender_type: { type: string, enum: [user, agent] }
        sender_id: { type: [string, 'null'] }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        run_id: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [completed, failed, streaming] }
        created_at: { type: string, format: date-time }
    Run:
      type: object
      required: [id, conversation_id, status, cancel_requested, created_at, agent_id, agent_owner_id, initiated_by_user_id]
      properties:
        id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid, description: Actual target Agent for this Run; its agents.owner_id is the executing Agent Owner. }
        agent_owner_id: { type: string, format: uuid, description: Derived from agent_id -> agents.owner_id; not stored as a Run snapshot. }
        initiated_by_user_id: { type: string, format: uuid, description: User who created or retried this Run. }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        cancel_requested: { type: boolean }
        error_code: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    ConversationRunAvailablePayload:
      type: object
      required: [run_id, target_agent_id, initiated_by_user_id, status]
      properties:
        run_id: { type: string, format: uuid }
        target_agent_id: { type: string, format: uuid }
        initiated_by_user_id: { type: string, format: uuid }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled] }
    ConversationEvent:
      type: object
      required: [schema_version, request_id, conversation_id, seq, type, occurred_at, payload]
      properties:
        schema_version: { type: string, const: '1.0' }
        request_id: { type: string }
        conversation_id: { type: string, format: uuid }
        seq: { type: integer, format: int64, minimum: 1 }
        type: { type: string, enum: [run.available] }
        occurred_at: { type: string, format: date-time }
        payload: { $ref: '#/components/schemas/ConversationRunAvailablePayload' }
    SendMessageResponse:
      type: object
      required: [message, run_id, status, target_agent_id, events_url, duplicate]
      properties:
        message: { $ref: '#/components/schemas/Message' }
        run_id: { type: string, format: uuid }
        target_agent_id: { type: string, format: uuid, description: Actual target Agent for the created or retried Run. }
        status:
          type: string
          description: Current run state; terminal values are available to idempotent duplicate callers.
          enum: [queued, running, succeeded, failed, cancelled]
        events_url: { type: string }
        duplicate: { type: boolean }
    Error:
      type: object
      required: [code, message, request_id, retryable]
      properties:
        code:
          type: string
          enum: [AUTH_REQUIRED, AUTH_INVALID, VALIDATION_FAILED, FORBIDDEN, NOT_FOUND, CONFLICT, RUN_NOT_CANCELLABLE, JOB_LEASE_INVALID, MODEL_TIMEOUT, MODEL_PROVIDER_ERROR, RUN_CANCELLED, RATE_LIMITED, INTERNAL]
        message: { type: string }
        request_id: { type: string }
        retryable: { type: boolean }
        details: { type: object, additionalProperties: true }
  responses:
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Authenticated user is not a Project member or lacks the required Project role
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: State conflict, including an existing active Run on send, removal of a member/Agent with an active Run, archiving a Project with an active Run, or removing/downgrading the last owner
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Internal failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
